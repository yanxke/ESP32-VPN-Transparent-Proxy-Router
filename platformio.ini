[env]
platform = espressif32 @ 7.0.1
framework = espidf
monitor_speed = 115200
extra_scripts = pre:tools/build_metadata.py, post:tools/pack_web_firmware.py

[env:esp32s3_r8n16]
board = esp32s3_r8n16
board_build.sdkconfig = sdkconfig.esp32s3_r8n16

[env:esp32s3_r8n8]
board = esp32s3_r8n8
board_build.sdkconfig = sdkconfig.esp32s3_r8n8
